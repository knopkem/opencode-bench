name: Agent image

on:
  push:
    branches: [main]
    paths:
      - bench.py
      - docker/agent.Dockerfile
      - docker/entrypoint.sh
      - docker/serve.mjs
      - tasks/spriteforge-lite/seed/package.json
      - tasks/spriteforge-lite/seed/package-lock.json
      - .dockerignore
      - .github/workflows/agent-image.yml
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build and publish, for example 1.2.3
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            tag="edge"
          else
            tag="${{ inputs.image_tag }}"
          fi
          if [[ ! "$tag" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "invalid image tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reference=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/opencode-bench-agent:$tag" \
            >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the public agent image
        run: |
          ./bench.py build \
            --agent-image "${{ steps.image.outputs.reference }}" \
            --opencode-version "${{ vars.OPENCODE_VERSION || '2.2.5' }}"

      - name: Verify the agent image
        run: |
          image="${{ steps.image.outputs.reference }}"
          docker run --rm --network none "$image" \
            bash -lc 'test ! -e /opt/opencode-bench/tests && test ! -e /opt/opencode-bench/reference'
          docker run --rm --network none "$image" \
            bash -lc 'opencode --version && node --version && npx playwright --version'

      - name: Push the public agent image
        run: docker push "${{ steps.image.outputs.reference }}"

      - name: Make the agent package public
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: opencode-bench-agent
        run: |
          owner_type="$(gh api "/users/$OWNER" --jq '.type' 2>/dev/null || echo Organization)"
          encoded="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["PACKAGE"], safe=""))')"
          if [[ "$owner_type" == "User" ]]; then
            endpoint="/user/packages/container/$encoded"
          else
            endpoint="/orgs/$OWNER/packages/container/$encoded"
          fi
          if ! gh api --method PATCH "$endpoint" -f visibility=public; then
            echo "::warning::Set $PACKAGE package visibility to public in GitHub Packages; the workflow token cannot manage this user package."
          fi
